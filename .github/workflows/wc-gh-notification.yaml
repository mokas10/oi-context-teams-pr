---
name: Notify on action status
run-name: "Notify on action status"

on:
  workflow_call:
    inputs:
      status:
        description: "Status to be send"
        required: false
        type: string
        default: "failure"
      targetEnvironment:
        description: "Environment to send notifications to"
        required: false
        type: string
        default: "dev"
      message:
        description: "Message to be send"
        required: false
        type: string
        default: "GitHub Action build result"

permissions:
  contents: "read"
  id-token: "write"
  checks: "write"

jobs:
  send-notification:
    name: "Send notification"
    runs-on: ubuntu-latest
    steps:
      - name: Get slack webhook
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: "https://vault-prod.build.ingka.ikea.com"
          namespace: "oi-ng-prod"
          method: jwt
          jwtGithubAudience: oi-ng
          role: "github-repo-read"
          exportToken: true
          exportEnv: true
          secrets: |
            secret/data/slack ${{ inputs.targetEnvironment }} | slack ;

      - name: Send notification
        id: slack
        # https://github.com/slackapi/slack-github-action
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          payload: |
            {
              "text": "${{ inputs.message }}: ${{ inputs.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ inputs.message }}: ${{ inputs.status }}\nGithub Repo: <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> \nRun details: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Run details>"
                  }
                }
              ]
            }
          webhook: "${{ fromJson(steps.vault.outputs.slack).webhook }}"
          webhook-type: webhook-trigger
