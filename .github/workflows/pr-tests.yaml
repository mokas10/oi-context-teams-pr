---
name: PR - Teams

on:
  pull_request:
    branches: ["*"]

jobs:
  # Generic formatting tests
  pr-tests:
    name: Formatting tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24

      - name: Setup
        run: |
          make setup

      - name: Test
        shell: bash
        env:
          SHELL: /usr/bin/bash
        run: |
          make test

  # Verify changes to teams and confirm those are allowed
  changed_files:
    name: Verify change validity
    needs: pr-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: "gcp-prod"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

        # authenticate to GCP to allow checks against Firestore
      - name: GCP auth
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUM }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ github.event.repository.name }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://europe-west1-${{ vars.GCP_PROJECT_ID }}.cloudfunctions.net/allen_backend

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@e0021407031f5be11a464abee9a0776171c79891 # v47.0.1
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Check if changes to teams happened
        id: check-changes
        run: |
          echo validfiles=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr " " "\n" | grep "teams" | grep '.yaml') >> $GITHUB_OUTPUT

      - name: Verify changes
        env:
          GCP_ID_TOKEN: ${{ steps.gcp-auth.outputs.id_token }}
          GCP_BACKEND_URL: https://europe-west1-${{ vars.GCP_PROJECT_ID }}.cloudfunctions.net/allen_backend
        run: |
          declare -a newfiles
          newfiles=()
          pip install -r .github/src/verify_change/requirements.txt
          for file in ${{ steps.check-changes.outputs.validfiles }}; do
            echo "Checking $file"
            if git show ${{ github.event.pull_request.base.sha }}:$file > oldfile ; then
              python .github/src/verify_change/verify_change.py oldfile $file
            else
              echo "File $file not found in base branch, new file"
              newfiles+=($file)
            fi
          done
          if (( ${#newfiles[@]} )); then
            printf -v joined '%s,' "${newfiles[@]}"
            echo "New files found, verifying changes $newfiles"
            python .github/src/verify_change/verify_new_file.py "${joined%,}"
          fi
