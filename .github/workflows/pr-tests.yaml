---
name: PR - Teams

on:
  pull_request:
    branches: ["*"]

jobs:
  # Generic formatting tests
  pr-tests:
    name: Formatting tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 18

      - name: Setup
        run: |
          make setup

      - name: Test
        shell: bash
        env:
          SHELL: /usr/bin/bash
        run: |
          make test

  # Verify changes to teams and confirm those are allowed
  changed_files:
    name: Verify change validity
    needs: pr-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@cc733854b1f224978ef800d29e4709d5ee2883e4 # v44.5.5
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Check if changes to teams happened
        id: check-changes
        run: |
          echo validfiles=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr " " "\n" | grep "teams" | grep '.yaml') >> $GITHUB_OUTPUT

      - name: Verify changes
        run: |
          pip install -r .github/src/verify_change/requirements.txt
          for file in ${{ steps.check-changes.outputs.validfiles }}; do
            echo "Checking $file"
            if git show ${{ github.event.pull_request.base.sha }}:$file > oldfile ; then
              python .github/src/verify_change/verify_change.py oldfile $file
            else
              echo "File $file not found in base branch, new file"
            fi
          done
