---
name: Push - Main Branch

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # check if deployment done by Argo is successful in GCP
  check_status_gcp:
    name: Check deployment status in GCP Dev
    uses: ./.github/workflows/wc-status-check.yaml
    permissions:
      contents: read
      id-token: write
    with:
      targetEnvironment: "dev"
      targetPlatform: "gcp"
      targetVersion: ${{ github.sha }}
  # check if deployment done by Argo is successful in Alicloud
  check_status_alicloud:
    name: Check deployment status in AliCloud Dev
    uses: ./.github/workflows/wc-status-check.yaml
    permissions:
      contents: read
      id-token: write
    with:
      targetEnvironment: "dev"
      targetPlatform: "alicloud"
      targetVersion: ${{ github.sha }}
    # update firestore in DEV with new changes
  update_firestore_dev:
    name: Update Firestore database in Dev with new information
    needs: [check_status_gcp, check_status_alicloud]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/wc-update-firestore.yaml
    with:
      env: "dev"
      head_sha: ${{ github.sha }}

  # if it was successful, trigger push to Prod
  push_to_prod:
    name: Push to GCP and AliCloud Prod
    needs: [update_firestore_dev]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Vault auth
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: "https://vault-prod.build.ingka.ikea.com"
          namespace: "oi-ng-prod"
          method: jwt
          jwtGithubAudience: oi-ng
          role: "github-repo-read"
          exportToken: false
          exportEnv: true
          secrets: |
            secret/data/github/pat l-context-a-itsehbg | GH_PAT ;
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: main
          token: ${{ env.GH_PAT }}
      - name: Git config
        run: |
          git config user.name "OI-Context bot"
          git config user.email l-context-a-itsehbg@ingka.ikea.com
      - name: Push to Prod branch
        run: |
          git checkout main
          git fetch origin
          git checkout prod
          git pull
          git merge origin/main
          git push origin prod
  # update firestore database with new changes
  update_firestore:
    name: Update Firestore database in Prod with new information
    needs: [push_to_prod]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/wc-update-firestore.yaml
    with:
      env: "prod"
      head_sha: ${{ github.sha }}
