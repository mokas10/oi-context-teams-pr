---
name: Push - Main Branch

on:
  push:
    branches: [main]
    paths:
      - "teams/**.yaml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # check if deployment done by Argo is successful in GCP
  check_status_gcp:
    uses: ./.github/workflows/wc-status-check.yaml
    permissions:
      contents: read
      id-token: write
    with:
      targetEnvironment: "dev"
      targetPlatform: "gcp"
      targetVersion: ${{ github.sha }}
  # check if deployment done by Argo is successful in Alicloud
  check_status_alicloud:
    uses: ./.github/workflows/wc-status-check.yaml
    permissions:
      contents: read
      id-token: write
    with:
      targetEnvironment: "dev"
      targetPlatform: "alicloud"
      targetVersion: ${{ github.sha }}
  # if it was successful, trigger push to Prod
  push_to_prod:
    needs: [check_status_gcp, check_status_alicloud]
    if: ${{ needs.check_status_gcp.outputs.status == 'success'  }} && ${{needs.check_status_alicloud.outputs.status == 'success'}}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: main
      - name: Git config
        run: |
          git config user.name "OI-Context bot"
          git config user.email l-context-a-itsehbg@ingka.ikea.com
      - name: Push to Prod branch
        run: |
          git config --list
          git checkout main
          git fetch origin
          git checkout prod
          git pull
          git merge origin/main
          git push origin prod
