---
name: Push - Main Branch

on:
  push:
    branches: [main]
    paths:
      - "teams/**.yaml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # check if deployment done by Argo is successful in GCP
  check_status_gcp:
    uses: ./.github/workflows/wc-status-check.yaml
    permissions:
      contents: read
      id-token: write
    with:
      targetEnvironment: "dev"
      targetPlatform: "gcp"
      targetVersion: ${{ github.sha }}
  # check if deployment done by Argo is successful in Alicloud
  check_status_alicloud:
    uses: ./.github/workflows/wc-status-check.yaml
    permissions:
      contents: read
      id-token: write
    with:
      targetEnvironment: "dev"
      targetPlatform: "alicloud"
      targetVersion: ${{ github.sha }}
  # if it was successful, trigger push to Prod
  push_to_prod:
    needs: [check_status_gcp, check_status_alicloud]
    if: ${{ needs.check_status_gcp.outputs.status == 'success'  }} && ${{needs.check_status_alicloud.outputs.status == 'success'}}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Vault auth
        uses: hashicorp/vault-action@d1720f055e0635fd932a1d2a48f87a666a57906c # v3.0.0
        with:
          url: "https://vault-prod.build.ingka.ikea.com"
          namespace: "oi-ng-prod"
          method: jwt
          jwtGithubAudience: oi-ng
          role: "github-repo-read"
          exportToken: false
          exportEnv: true
          secrets: |
            secret/data/github/pat l-context-a-itsehbg | GH_PAT ;
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: main
          token: ${{ env.GH_PAT }}
      - name: Git config
        run: |
          git config user.name "OI-Context bot"
          git config user.email l-context-a-itsehbg@ingka.ikea.com
      - name: Push to Prod branch
        run: |
          git config --list
          git checkout main
          git fetch origin
          git checkout prod
          git pull
          git merge origin/main
          git push origin prod
