---
name: Update Firestore

on:
  workflow_call:
    inputs:
      env:
        description: "Environment to run in"
        required: false
        type: string
        default: "dev"
      head_sha:
        description: "Head SHA to compare against"
        required: true
        type: string
        default: "main"
jobs:
  update_firestore:
    name: Update Firestore database with new information
    runs-on: ubuntu-latest
    environment:
      name: "gcp-${{ inputs.env }}"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      # authenticate to GCP to allow changes in Firestore
      - name: GCP auth
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUM }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ github.event.repository.name }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/datastore

      - name: Get last SHA
        id: get-last-sha
        env:
          GCP_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          pip install -r .github/src/firestore_sync/requirements.txt
          python .github/src/firestore_sync/sync_status.py get_last_sha

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@e0021407031f5be11a464abee9a0776171c79891 # v47.0.1
        with:
          base_sha: ${{ steps.get-last-sha.outputs.last_sha || 'main' }}

      - name: Check if changes to teams resources happened
        id: check-changes
        run: |
          echo validfiles=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr " " "\n" | grep "teams" | grep '.yaml') >> $GITHUB_OUTPUT

      - name: Apply changes to Firestore in ${{inputs.env}}
        if: steps.check-changes.outputs.validfiles != ''
        env:
          GCP_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          echo "Checking out last commit ${{ steps.get-last-sha.outputs.last_sha || 'main' }}"
          pip install -r .github/src/firestore_sync/requirements.txt
          for file in ${{ steps.check-changes.outputs.validfiles }}; do
            echo "Checking $file"
            if git show ${{ steps.get-last-sha.outputs.last_sha || 'main' }}:$file > oldfile ; then
              echo "File $file found in base branch, updating team"
              python .github/src/firestore_sync/update_firestore.py oldfile $file
            fi
          python .github/src/firestore_sync/sync_status.py update_last_sha ${{ inputs.head_sha }}
          done
