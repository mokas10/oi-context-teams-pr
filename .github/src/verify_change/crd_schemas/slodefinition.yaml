apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: cslos.context.ingka.com
spec:
  # either Namespaced or Cluster
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: cslos
    # singular name to be used as an alias on the CLI and for display
    # since pyrra is using servicelevelobjective and slo, using c as a prefix for context
    singular: cslo
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: SLO
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
      - cslo
      - ctxtslo
  # group name to use for REST API: /apis/<group>/<version>
  group: context.ingka.com
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1
      # Each version can be enabled/disabled by Served flag.
      served: true
      # One and only one version must be marked as the storage version.
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required:
                - indicator
                - target
                - window
                - location
              properties:
                description:
                  type: string
                location:
                  type: string
                target:
                  type: string
                window:
                  type: string
                labels:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                indicator:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    bool_gauge:
                      type: object
                      properties:
                        grouping:
                          items:
                            type: string
                          type: array
                        metric:
                          type: string
                      required:
                        - metric
                    latency:
                      type: object
                      properties:
                        grouping:
                          items:
                            type: string
                          type: array
                        success:
                          properties:
                            metric:
                              type: string
                          required:
                            - metric
                          type: object
                        total:
                          properties:
                            metric:
                              type: string
                          required:
                            - metric
                          type: object
                      required:
                        - success
                        - total
                    latencyNative:
                      type: object
                      properties:
                        grouping:
                          items:
                            type: string
                          type: array
                        latency:
                          type: string
                        total:
                          properties:
                            metric:
                              type: string
                          required:
                            - metric
                          type: object
                      required:
                        - latency
                        - total
                    ratio:
                      type: object
                      properties:
                        errors:
                          properties:
                            metric:
                              type: string
                          required:
                            - metric
                          type: object
                        grouping:
                          items:
                            type: string
                          type: array
                        total:
                          properties:
                            metric:
                              type: string
                          required:
                            - metric
                          type: object
                      required:
                        - errors
                        - total
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                synced:
                  type: boolean
                update:
                  type: boolean
      subresources:
        # status enables the status subresource.
        status: {}
    - name: v2beta1
      # Each version can be enabled/disabled by Served flag.
      served: true
      # v1 remains the storage version; v2beta1 uses x-kubernetes-preserve-unknown-fields: true on spec
      # so all v2beta1-only fields survive round-trips through the v1 storage representation.
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required:
                - owner
                - service
                - environment
                - version
                - objective
                - description
                - locations
                - indicator
                - alerting
              properties:
                owner:
                  type: string
                service:
                  type: string
                environment:
                  type: string
                version:
                  type: string
                objective:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100
                description:
                  type: string
                locations:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - gcp-eu
                      - alicloud-cn
                time_window:
                  type: string
                mimir_tenant:
                  type: string
                  default: public
                paused:
                  type: boolean
                  default: true
                dev:
                  type: boolean
                  default: false
                labels:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                alerting:
                  type: object
                  required:
                    - page_alert
                    - ticket_alert
                  properties:
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    page_alert:
                      type: object
                      required:
                        - severity
                      properties:
                        severity:
                          type: string
                        receiver:
                          type: string
                          default: context-event
                        disable:
                          type: boolean
                          default: false
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                        annotations:
                          type: object
                          additionalProperties:
                            type: string
                    ticket_alert:
                      type: object
                      required:
                        - severity
                      properties:
                        severity:
                          type: string
                        receiver:
                          type: string
                          default: context-event
                        disable:
                          type: boolean
                          default: false
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                        annotations:
                          type: object
                          additionalProperties:
                            type: string
                indicator:
                  type: object
                  oneOf:
                    - required: ["events"]
                    - required: ["raw"]
                  properties:
                    events:
                      type: object
                      required:
                        - error_query
                        - total_query
                      properties:
                        error_query:
                          type: string
                        total_query:
                          type: string
                    raw:
                      type: object
                      required:
                        - error_ratio_query
                      properties:
                        error_ratio_query:
                          type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                grafana_sync:
                  type: string
                error:
                  type: string
      subresources:
        # status enables the status subresource.
        status: {}
