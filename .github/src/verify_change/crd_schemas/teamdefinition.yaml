apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: teams.context.ingka.com
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: context.ingka.com
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1
      # Each version can be enabled/disabled by Served flag.
      served: true
      # One and only one version must be marked as the storage version.
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - displayName
                - locations
                - roles
                - smc
              properties:
                displayName:
                  type: string
                owner:
                  type: string
                smc:
                  type: array
                  items:
                    type: string
                locations:
                  type: array
                  items:
                    type: string
                roles:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      groups:
                        type: array
                        items:
                          type: string
                contactPoints:
                  type: array
                  items:
                    type: object
                    required:
                      - notificationPolicy
                    oneOf:
                      - properties:
                        required: ["webhook"]
                      - properties:
                        required: ["slack"]
                      - properties:
                        required: ["email"]
                      - properties:
                        required: ["teams"]
                    properties:
                      notificationPolicy:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        required:
                          - group_by
                          - matchers
                        properties:
                          group_by:
                            type: array
                            items:
                              type: string
                          matchers:
                            type: array
                            items:
                              type: string
                      webhook:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        required:
                          - name
                          - url
                        properties:
                          name:
                            type: string
                          url:
                            type: string
                          send_resolved:
                            type: boolean
                      slack:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        required:
                          - name
                          - api_url
                          - channel
                        properties:
                          name:
                            type: string
                          api_url:
                            type: string
                          channel:
                            type: string
                          send_resolved:
                            type: boolean
                          text:
                            type: string
                      email:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        required:
                          - name
                          - to
                        properties:
                          name:
                            type: string
                          to:
                            type: string
                          send_resolved:
                            type: boolean
                      teams:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        required:
                          - name
                          - url
                        properties:
                          name:
                            type: string
                          url:
                            type: string
                          title:
                            type: string
                          text:
                            type: string
                          send_resolved:
                            type: boolean
                tenants:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      cost_center:
                        type: string
                      project_code:
                        type: string
                      read_access:
                        type: array
                        items:
                          type: string
                      write_access:
                        type: array
                        items:
                          type: string
                otherDatasources:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
                tokens:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      location:
                        type: string
                      permissions:
                        type: string
                      tenant:
                        type: string
                      expires:
                        type: string
            status:
              type: object
              properties:
                grafana_org:
                  type: integer
                org_name:
                  type: string
                update:
                  type: boolean
                grafana_dashboards:
                  type: object
                  additionalProperties:
                    type: string
                tenants:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
      subresources:
        # status enables the status subresource.
        status: {}
  # either Namespaced or Cluster
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: teams
    # singular name to be used as an alias on the CLI and for display
    singular: team
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: Team
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
      - ct
