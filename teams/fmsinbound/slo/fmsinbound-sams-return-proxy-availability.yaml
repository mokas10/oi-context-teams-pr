---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: fmsinbound-sams-return-proxy-availability
spec:
  description: "SLO for FMS Inbound SAMS Return Proxy availability based on the error rate"
  target: "99.7"
  location: "gcp-eu"
  window: "30d"
  labels:
    - name: "service.name"
      value: "sams-return-proxy"
    - name: "deployment.environment.name"
      value: "prod"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "CONTEXT"
    - name: "ingka.team"
      value: "dt-fl-fms-receiving"
    - name: "ingka.version"
      value: "0.5.0"
  indicator:
    ratio:
      errors:
        metric: sum(increase(http_server_requests_seconds_count{service_name="sams-return-proxy", deployment_environment="prod", status=~"500|400|401|403"}[5m]))
      total:
        metric: sum(increase(http_server_requests_seconds_count{service_name="sams-return-proxy", deployment_environment="prod"}[5m]))
