---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: fmsinbound-sams-return-proxy-availability
spec:
  description: "SLO for FMS Inbound SAMS Return Proxy availability based on the error rate"
  # Temporarily set target to 100% to trigger the alert and see if we get notified correctly
  # target: "99.7"
  target: "100"
  location: "gcp-eu"
  window: "30d"
  labels:
    - name: "service.name"
      value: "fms-inbound-sams-return-proxy"
    - name: "deployment.environment.name"
      value: "prod"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "FMSRR"
    - name: "ingka.team"
      value: "eureka"
    - name: "ingka.version"
      value: "0.5.0"
  indicator:
    ratio:
      errors:
        metric: http_server_requests_seconds_count{service_name="fms-inbound-sams-return-proxy", deployment_environment="prod", status=~"500|503|401|403"}
      total:
        metric: http_server_requests_seconds_count{service_name="fms-inbound-sams-return-proxy", deployment_environment="prod"}
