---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: fmsinbound
spec:
  # display name in Grafana
  displayName: "FMS-Inbound"
  # owner / responsible for the team
  owner: "sander.sietses@ingka.ikea.com"
  # systems connected to this team
  smc:
    - "FMSRR"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
    - "alicloud-cn"
  contactPoints:
    - notificationPolicy:
        group_by:
          - "alertname"
        matchers:
          - "ingka_system_name=FMSRR"
          - "ingka_team=eureka"
      webhook:
        name: "fms-inbound-ilert-receiver"
        url: "$fms-inbound-ilertwebhook"
        send_resolved: true
  otherDatasources:
    - type: alertmanager
      tenant: "FMS-Inbound"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - "IAM_AAD_Team_FMS-Testing"
        - "IAM_AAD_Team_FMS-SLF"
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "IAM_AAD_Team_dt-fl-fms-receiving"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "FMS-Inbound"
      # cost center associated with this tenant
      cost_center: "CC5208"
      # project code associated with this tenant
      project_code: "IN009695"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "fmsinbound"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "fmsinbound"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "FMS-Inbound_read_FMS-Inbound_1716794811"
      location: "gcp-eu"
      permissions: "read"
      tenant: "FMS-Inbound"
      expires: "False"
    - name: "FMS-Inbound_write_FMS-Inbound_1709039746"
      location: "gcp-eu"
      permissions: "write"
      tenant: "FMS-Inbound"
      expires: "False"
