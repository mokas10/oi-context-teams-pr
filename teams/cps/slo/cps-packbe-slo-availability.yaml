---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: cps-packbe-availability-prod
spec:
  description: "SLO for API availability based on the HTTP Status Codes -prod"
  location: "gcp-eu"
  target: "99.7"
  window: "30d"
  labels:
    - name: "service.name"
      value: "cps-pack-backend"
    - name: "deployment.environment.name"
      value: "prod"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "cps"
    - name: "ingka.team"
      value: "cps"
    - name: "ingka.version"
      value: "0.5.0"
  indicator:
    ratio:
      errors:
        metric: http_server_requests_seconds_count{app="cps-pack-backend",deployment_environment="prod",status=~"5..",uri!~"/actuator/.*|root"}
      total:
        metric: http_server_requests_seconds_count{app="cps-pack-backend",deployment_environment="prod",uri!~"/actuator/.*|root"}
