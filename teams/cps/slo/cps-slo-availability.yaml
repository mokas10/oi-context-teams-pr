---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: cps-pickbe-availability-prod-test
spec:
  description: "SLO for API availability based on the HTTP Status Codes"
  location: "gcp-eu"
  target: "99"
  window: "30d"
  labels:
    - name: "service.name"
      value: "cps-pick-backend"
    - name: "deployment.environment.name"
      value: "prod"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "cps"
    - name: "ingka.team"
      value: "cps"
    - name: "ingka.version"
      value: "0.5.0"
  indicator:
    ratio:
      errors:
        metric: sum(rate(http_server_requests_seconds_count{app="cps-pick-backend",status=~"5..",uri!~"/actuator/.*|root"}))
      total:
        metric: sum(rate(http_server_requests_seconds_count{app="cps-pick-backend",uri!~"/actuator/.*|root"}))
