---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: foundationalengineeringcore
spec:
  # display name in Grafana
  displayName: "Foundational Engineering - Core"
  # owner / responsible for the team
  owner: "ljupcho.kotev@ingka.com"
  # systems connected to this team
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
    - "alicloud-cn"
  cost_center: "CC5260"
  # will define contact points for this team to be synced to the Mimir Alertmanager
  contactPoints:
    # notification policy is mandatory for each contact point, one policy per point
    - notificationPolicy:
        group_by:
          - "alertname"
          - "cluster"
        matchers:
          - cluster=~(jfrog-platform-staging|vault-west1-staging|vault-west4-staging|vault-shanghai-two-staging|vault-shanghai-one-staging)
      # one and exactly one type of contact point has to be provided
      # supported (for now) are: webhook, slack, teams, email
      webhook:
        # name is mandatory, will be used combined with team name
        name: "staging-ilert-receiver"
        url: "$foundationalengineeringcore-ilertstaging"
        send_resolved: true
    - notificationPolicy:
        group_by:
          - "alertname"
          - "cluster"
        matchers:
          - cluster=~(jfrog-platform-production|vault-west1|vault-west4|vault-shanghai-two|vault-shanghai-one)
      webhook:
        name: "production-ilert-receiver"
        url: "$foundationalengineeringcore-ilertproduction"
        send_resolved: true
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
        - ""
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - ""
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "IAM_AAD_Team_es-core"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "argo"
      # cost center associated with this tenant
      # wbs associated with this tenant
      wbs: "TBM-P1041-C01-COR-OP2120"
      # smc associated with this tenant
      smc: "Foundational Engineering - Core"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "foundationalengineeringcore"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "foundationalengineeringcore"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "vault"
      # cost center associated with this tenant
      # wbs associated with this tenant
      wbs: ""
      # smc associated with this tenant
      smc: "Foundational Engineering - Core"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "foundationalengineeringcore"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "foundationalengineeringcore"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "artifactory"
      # cost center associated with this tenant
      # wbs associated with this tenant
      wbs: "TBM-P1041-C01-COR-OP2120"
      # smc associated with this tenant
      smc: "Foundational Engineering - Core"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "foundationalengineeringcore"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "foundationalengineeringcore"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "artifactory_write_Foundational Engineering - Core_1678886241"
      location: "gcp-eu"
      permissions: "write"
      tenant: "artifactory"
      expires: "False"
    - name: "artifactory_write_Foundational Engineering - Core_1678886241"
      location: "alicloud-cn"
      permissions: "write"
      tenant: "artifactory"
      expires: "False"
    - name: "vault_write_Foundational Engineering - Core_1678886227"
      location: "gcp-eu"
      permissions: "write"
      tenant: "vault"
      expires: "False"
    - name: "vault_write_Foundational Engineering - Core_1678886227"
      location: "alicloud-cn"
      permissions: "write"
      tenant: "vault"
      expires: "False"
    - name: "argo_write_Foundational Engineering - Core_1751610682"
      location: "gcp-eu"
      permissions: "write"
      tenant: "argo"
      expires: "False"
