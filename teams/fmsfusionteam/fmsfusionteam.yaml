---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: fmsfusionteam
spec:
  # display name in Grafana
  displayName: "FMS-Fusion-team"
  # owner / responsible for the team
  owner: "nikolay.diakov@ingka.ikea.com"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
        - "IAM_AAD_Team_MHS_SLF"
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - ""
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "IAM_AAD_Team_DT_FL_FMS_Fusion"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "cutovertransform"
      # cost center associated with this tenant
      cost_center: "CC5171"
      # project code associated with this tenant
      project_code: "IN_008761"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "fmsfusionteam"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "fmsfusionteam"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "Precog"
      # cost center associated with this tenant
      cost_center: "CC5171"
      # project code associated with this tenant
      project_code: "IN_008761"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "fmsfusionteam"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "fmsfusionteam"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "CCSync"
      # cost center associated with this tenant
      cost_center: "CC5171"
      # project code associated with this tenant
      project_code: "IN_008761"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "fmsfusionteam"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "fmsfusionteam"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "CCSync_write_FMS-Fusion-team_1713881156"
      location: "gcp-eu"
      permissions: "write"
      tenant: "CCSync"
      expires: "False"
    - name: "Precog_write_FMS-Fusion-team_1713881157"
      location: "gcp-eu"
      permissions: "write"
      tenant: "Precog"
      expires: "False"
    - name: "cutovertransform_write_FMS-Fusion-team_1762185222"
      location: "gcp-eu"
      permissions: "write"
      tenant: "cutovertransform"
      expires: "False"
