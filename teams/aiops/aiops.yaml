---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: aiops
spec:
  # display name in Grafana
  displayName: "AIOPS"
  # owner / responsible for the team
  owner: "karan.honavar@ingka.ikea.com"
  # systems connected to this team
  smc:
    - "not provided"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
  cost_center: "CC5344"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
        - ""
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - ""
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "IAM_AAD_Automation_Framework"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "AIOPS-Automation-Framework-Prod"
      # cost center associated with this tenant
      cost_center: "CC5344"
      # wbs associated with this tenant
      wbs: "TBM-P1011-C04-ADV-OP2120"
      # smc associated with this tenant
      smc: "not provided"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "aiops"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "aiops"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "AIOPS-Automation-Framework-Dev"
      # cost center associated with this tenant
      cost_center: "CC5344"
      # wbs associated with this tenant
      wbs: "TBM-P1011-C04-ADV-OP2120"
      # smc associated with this tenant
      smc: "not provided"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "aiops"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "aiops"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "AIOPS-Automation-Framework-Dev_read_AIOPS_1718785084"
      location: "gcp-eu"
      permissions: "read"
      tenant: "AIOPS-Automation-Framework-Dev"
      expires: "False"
    - name: "AIOPS-Automation-Framework-Dev_write_AIOPS_1713434569"
      location: "gcp-eu"
      permissions: "write"
      tenant: "AIOPS-Automation-Framework-Dev"
      expires: "False"
    - name: "AIOPS-Automation-Framework-Prod_write_AIOPS_1714482039"
      location: "gcp-eu"
      permissions: "write"
      tenant: "AIOPS-Automation-Framework-Prod"
      expires: "False"
