apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # resource name - CANNOT be changed!
  name: newexampleteam
spec:
  # this display name can be changed to rename org in Grafana
  displayName: "New Example Grafana Team 1"
  # owner / responsible for the team
  owner: "manager@ingka.com"
  # locations where team will be added
  locations:
    # gcp-eu / alicloud-cn
    - "gcp-eu"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "ADGroup1"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - name: "tenant1"
      cost_center: "CC1234"
      project_code: "IN1234"
      read_access:
        - "exampleteam"
        - "secondexampleteam"
      # teams allowed to write - (future) permission to create write token
      write_access:
        - "exampleteam"
  otherDatasources:
    - type: alertmanager
      tenant: public
  # tokens OWNED by this team, information about these tokens
  tokens:
    - name: "Tokenname"
      location: "gcp-eu"
      permissions: "write"
      tenant: "tenant1"
      expires: "False"
