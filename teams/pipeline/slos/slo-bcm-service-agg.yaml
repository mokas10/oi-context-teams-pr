---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: pipeline-bcm-request-demo
spec:
  description: "Request SLO for BCM 98% Valid Requests"
  location: "gcp-eu"
  target: "98"
  window: "4w"
  labels:
    - name: "deployment.environment.name"
      value: "dev"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "TBD"
    - name: "ingka.team"
      value: "oi-op"
    - name: "ingka.version"
      value: "0.5.0"
  indicator:
    ratio:
      errors:
        metric: >
          http_server_duration_milliseconds_bucket{service_name="bcm-comapanies-api", 
          http_status_code=~"5.."}
      total:
        metric: >
          http_server_duration_milliseconds_count{service_name="bcm-comapanies-api"}
