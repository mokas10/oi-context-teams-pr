---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: pipeline-bcm-latency-demo-a
spec:
  description: "Latency SLO for BCM on Specific Endpoint A less than 2sec"
  location: "gcp-eu"
  target: "99"
  window: "4w"
  labels:
    - name: "deployment.environment.name"
      value: "dev"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "TBD"
    - name: "ingka.team"
      value: "oi-op"
    - name: "ingka.version"
      value: "0.5.0"
  indicator:
    latency:
      success:
        metric: >
          http_server_duration_milliseconds_bucket{service_name="bcm-comapanies-api", 
          http_route="/v2/retail-units/:retailUnit/companies/:companyId/purchases/:purchaseId/invoices", 
          http_status_code=~"2..", 
          le="2000"}
      total:
        metric: >
          http_server_duration_milliseconds_count{service_name="bcm-comapanies-api", 
          http_route="/v2/retail-units/:retailUnit/companies/:companyId/purchases/:purchaseId/invoices", 
          http_status_code=~"2.."}
