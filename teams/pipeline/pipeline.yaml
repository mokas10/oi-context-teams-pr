---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: pipeline
spec:
  # display name in Grafana
  displayName: "pipeline"
  # owner / responsible for the team
  owner: "patrik.nystrom1@ingka.ikea.com"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
    - "alicloud-cn"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
        - ""
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - ""
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "IAM_AAD_Team_oi-op"
        - "IAM_AAD_Team_DPS-OI-NextGen"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "oi"
      # cost center associated with this tenant
      cost_center: "0"
      # project code associated with this tenant
      project_code: "0"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "pipeline"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "pipeline"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "self-monitoring"
      # cost center associated with this tenant
      cost_center: "CC1234"
      # project code associated with this tenant
      project_code: "IN12345"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "pipeline"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "pipeline"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "oi-2"
      # cost center associated with this tenant
      cost_center: "0"
      # project code associated with this tenant
      project_code: "0"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "pipeline"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "pipeline"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "oi-2_write_pipeline_1694592495"
      location: "gcp-eu"
      permissions: "write"
      tenant: "oi-2"
      expires: "False"
    - name: "oi_read_pipeline_1698750713"
      location: "gcp-eu"
      permissions: "read"
      tenant: "oi"
      expires: "False"
    - name: "oi_read_pipeline_1720443510"
      location: "gcp-eu"
      permissions: "read"
      tenant: "oi"
      expires: "False"
    - name: "oi_read_pipeline_1678977401"
      location: "gcp-eu"
      permissions: "read"
      tenant: "oi"
      expires: "False"
    - name: "oi_read_pipeline_1678977401"
      location: "alicloud-cn"
      permissions: "read"
      tenant: "oi"
      expires: "False"
