---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: applicationhosting
spec:
  # display name in Grafana
  displayName: "Application-Hosting"
  # owner / responsible for the team
  owner: "jonas.wennberg@ingka.ikea.com"
  # systems connected to this team
  smc:
    - "Application-Hosting-as-a-Service"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
    - "alicloud-cn"
  cost_center: "5320"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
        - ""
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - "IAM_AAD_Team_iSell_client_devs"
        - "IAM_AAD_Team_iSell_devs"
        - "IAM_AAD_Team_DFP"
        - "IAM_AAD_Team_DCI"
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "IAM_AAD_Team_Middleware"
        - "IAM_AAD_Team_ApplicationHosting"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "Application-Hosting"
      # cost center associated with this tenant
      cost_center: "5320"
      # wbs associated with this tenant
      wbs: "PRJ003657"
      # smc associated with this tenant
      smc: "Application-Hosting-as-a-Service"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "applicationhosting"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "applicationhosting"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "Application-Hosting_write_Application-Hosting_1686308774"
      location: "gcp-eu"
      permissions: "write"
      tenant: "Application-Hosting"
      expires: "False"
    - name: "Application-Hosting_write_Application-Hosting_1756726728"
      location: "alicloud-cn"
      permissions: "write"
      tenant: "Application-Hosting"
      expires: "False"
