---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: webbuyingexperience
spec:
  # display name in Grafana
  displayName: "web-buying-experience"
  # owner / responsible for the team
  owner: "carl-ola.boketoft@ingka.ikea.com"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
        - "IAM_AAD_web_checkout_grafana_viewer"
        - "Tech LT Omni Meeting Points"
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - "DL web_checkout engineering SE"
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - ""
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "webcart"
      # cost center associated with this tenant
      cost_center: "CC5351"
      # project code associated with this tenant
      project_code: "IN010045"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "webbuyingexperience"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "webbuyingexperience"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "webcheckout"
      # cost center associated with this tenant
      cost_center: "CC5351"
      # project code associated with this tenant
      project_code: "IN010045"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "webbuyingexperience"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "webbuyingexperience"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "webcart_write_web-buying-experience_1714045384"
      location: "gcp-eu"
      permissions: "write"
      tenant: "webcart"
      expires: "False"
    - name: "webcheckout_write_web-buying-experience_1714045382"
      location: "gcp-eu"
      permissions: "write"
      tenant: "webcheckout"
      expires: "False"
