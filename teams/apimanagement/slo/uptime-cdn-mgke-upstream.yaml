---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: apimanagement-uptime-cdn-mgke-upstream
spec:
  description: "Monthly uptime SLO for API Buckets served by the CDN and using MGKE as the upstream"
  location: "gcp-eu"
  target: "99.97"
  window: "30d"
  labels:
    - name: "deployment.environment.name"
      value: "prod"
    - name: "deployment.environment"
      value: "ingka-apim-prod"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "api-gateway"
    - name: "ingka.team"
      value: "api-management"
    - name: "ingka.version"
      value: "0.5.0"
    - name: "testing"
      value: "true"
  indicator:
    bool_gauge:
      metric: probe_success{context_tenant="apim", gateway="api.ingka.ikea.com", testing!="true", deployment_environment=~".*prod", platform="mgke/internal"}
      grouping:
        - api_bucket
