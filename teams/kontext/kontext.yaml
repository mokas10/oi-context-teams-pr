---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: kontext
spec:
  # display name in Grafana
  displayName: "KONTEXT"
  # owner / responsible for the team
  owner: "niclas.nilsson@ingka.ikea.com"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
    - "alicloud-cn"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
        - ""
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - ""
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "IAM_AAD_Team_DPS-OI-NextGen"
  # optional
  # will define contact points for this team to be synced to the Mimir Alertmanager
  contactPoints:
    # notification policy is mandatory for each contact point, one policy per point
    - notificationPolicy:
        group_by:
          - "alertname"
        matchers:
          - "ingka_system_name=CONTEXT"
          - "ingka_team=KONTEXT"
          - "severity=critical"
      # one and exactly one type of contact point has to be provided
      # supported (for now) are: webhook, slack, teams, email
      webhook:
        # name is mandatory, will be used combined with team name
        name: "critical-alerts"
        url: "example-url.com"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "oi"
      # cost center associated with this tenant
      cost_center: "0"
      # project code associated with this tenant
      project_code: "0"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "kontext"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "kontext"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "self-monitoring"
      # cost center associated with this tenant
      cost_center: "CC1234"
      # project code associated with this tenant
      project_code: "IN1234"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "kontext"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "kontext"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "self-monitoring_write_KONTEXT_1704963837"
      location: "gcp-eu"
      permissions: "write"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_write_KONTEXT_1708596640"
      location: "gcp-eu"
      permissions: "write"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_read_KONTEXT_1683192570"
      location: "gcp-eu"
      permissions: "read"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_read_KONTEXT_1683192570"
      location: "alicloud-cn"
      permissions: "read"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_read_KONTEXT_1683198399"
      location: "gcp-eu"
      permissions: "read"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_read_KONTEXT_1683198399"
      location: "alicloud-cn"
      permissions: "read"
      tenant: "self-monitoring"
      expires: "False"
