---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: kontext
spec:
  # display name in Grafana
  displayName: "KONTEXT"
  # owner / responsible for the team
  owner: "niclas.nilsson@ingka.ikea.com"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
    - "alicloud-cn"

  # optional
  # will define contact points for this team to be synced to the Mimir Alertmanager
  contactPoints:
    # notification policy is mandatory for each contact point, one policy per point
    - notificationPolicy:
        group_by:
          - "alertname"
        matchers:
          - "ingka_system_name=CONTEXT"
          - "ingka_team=OI-NextGen"
          - "severity=warning"
      # one and exactly one type of contact point has to be provided
      # supported (for now) are: webhook, slack, teams, email
      slack:
        # name is mandatory, will be used combined with team name
        name: "slack-$kontext-slackchannellow"
        api_url: "$kontext-slackurllow"
        channel: "$kontext-slackchannellow"
        link_names: false
        send_resolved: false
        short_fields: false
        text: "{{ range .Alerts }}Summary: {{ .Annotations.summary }}\nDescription: {{ .Annotations.description }}\nMessage: {{ .Annotations.message }}\n\n{{ end }}"
        footer: "{{ .CommonAnnotations.runbook_url }}"
    - notificationPolicy:
        group_by:
          - "alertname"
        matchers:
          - "ingka_system_name=CONTEXT"
          - "ingka_team=OI-NextGen"
          - "severity=critical"
      slack:
        name: "slack-$kontext-slackchannelhigh"
        api_url: "$kontext-slackurlhigh"
        channel: "$kontext-slackchannelhigh"
        link_names: false
        send_resolved: false
        short_fields: false
        text: "{{ range .Alerts }}Summary: {{ .Annotations.summary }}\nDescription: {{ .Annotations.description }}\nMessage: {{ .Annotations.message }}\n\n{{ end }}"
        footer: "{{ .CommonAnnotations.runbook_url }}"
    - notificationPolicy:
        # empty notification policy means that no alerts will be sent to this contact point
        group_by:
          - "alertname"
        matchers:
          - "ingka_team=OI-NextGen"
          - "otherval=nonexist"
      webhook:
        name: "ilert-receiver"
        url: "$kontext-ilert"
        send_resolved: true
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "oi"
      # cost center associated with this tenant
      cost_center: "0"
      # project code associated with this tenant
      project_code: "0"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "kontext"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "kontext"
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "self-monitoring"
      # cost center associated with this tenant
      cost_center: "CC1234"
      # project code associated with this tenant
      project_code: "IN1234"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "kontext"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "kontext"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "self-monitoring_write_KONTEXT_1704963837"
      location: "gcp-eu"
      permissions: "write"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_write_KONTEXT_1708596640"
      location: "gcp-eu"
      permissions: "write"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_read_KONTEXT_1683192570"
      location: "gcp-eu"
      permissions: "read"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_read_KONTEXT_1683192570"
      location: "alicloud-cn"
      permissions: "read"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_read_KONTEXT_1683198399"
      location: "gcp-eu"
      permissions: "read"
      tenant: "self-monitoring"
      expires: "False"
    - name: "self-monitoring_read_KONTEXT_1683198399"
      location: "alicloud-cn"
      permissions: "read"
      tenant: "self-monitoring"
      expires: "False"
