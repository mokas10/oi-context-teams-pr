---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: testslo
spec:
  description: "This is a test SLO for Kontext"
  target: "99.9"
  location: "gcp-eu"
  dev: true
  window: "30d"
  labels:
    - name: "service.name"
      value: "k8s_operator"
    - name: "deployment.environment.name"
      value: "dev"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "CONTEXT"
    - name: "ingka.team"
      value: "DPS-OI-NextGen"
    - name: "ingka.version"
      value: "0.5.0"
  indicator:
    ratio:
      errors:
        metric: demo_test_counter > 30
      total:
        metric: demo_test_counter
      grouping:
        - entity
