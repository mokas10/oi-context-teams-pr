---
apiVersion: "context.ingka.com/v1"
kind: SLO
metadata:
  name: fulfillmentoptions-cart-context-p95-req-latency
spec:
  description: "SLO for Cart-Context API Latency. 95 percentile of request latency are below 100ms"
  target: "95"
  location: "gcp-eu"
  window: "30d"
  labels:
    - name: "service.name"
      value: "cart-context"
    - name: "deployment.environment.name"
      value: "prod"
    - name: "ingka.legal_company"
      value: "ingka"
    - name: "ingka.system_name"
      value: "FOP"
    - name: "ingka.team"
      value: "FulfillmentOptions"
    - name: "ingka.version"
      value: "0.5.0"
  indicator:
    latency:
      success:
        metric: kong_statsd_request_latency_ms_bucket{service=~"cart-context", deployment_environment="ingka-apim-prod", le="100"}
      total:
        metric: kong_statsd_request_latency_ms_count{service=~"cart-context", deployment_environment="ingka-apim-prod"}
