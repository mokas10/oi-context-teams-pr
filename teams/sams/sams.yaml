---
apiVersion: "context.ingka.com/v1"
kind: Team
metadata:
  # READ ONLY! resource name - CANNOT be changed!
  name: sams
spec:
  # display name in Grafana
  displayName: "SAMS"
  # owner / responsible for the team
  owner: "leif.nilsson@ingka.ikea.com"
  # systems connected to this team
  smc:
    - "SM-100508"
  # locations where team will be added
  locations:
    # possible values: gcp-eu / alicloud-cn
    - "gcp-eu"
  cost_center: "CC5357"
  # role definitions for this team
  roles:
    # allowed to view / query data, create READ token
    - name: "0-Viewer"
      groups:
        - "Tech LT Omni Meeting Points"
    # allowed to create dashboards, create WRITE token
    - name: "1-Editor"
      groups:
        - "IAM_AAD_Team_sams"
    # allowed to create datasources and service accounts
    - name: "2-Admin"
      groups:
        - "IAM_AAD_Team_sams"
  # tenants OWNED by this team, information about these tenants
  tenants:
    - # READ ONLY! tenant name - CANNOT be changed!
      name: "SAMS"
      # cost center associated with this tenant
      cost_center: "CC5357"
      # wbs associated with this tenant
      wbs: "PRJ002921"
      # smc associated with this tenant
      smc: "SM-100508"
      # teams allowed to read - automatically adding loki datasources
      # for these teams
      read_access:
        - "sams"
      # teams allowed to write - will in the future add permissions to create write token
      write_access:
        - "sams"
  # READ ONLY! tokens OWNED by this team, information about these tokens
  tokens:
    - name: "SAMS_write_SAMS_1758017442"
      location: "gcp-eu"
      permissions: "write"
      tenant: "SAMS"
      expires: "False"
